services:
  postgres:
    # Com pgvector (busca por embeddings do assistente). Imagem Debian/glibc: ao trocar a partir da alpine, restaure
    # de um pg_dump em volume novo (ver README), senão a collation do volume antigo fica inconsistente.
    image: pgvector/pgvector:pg18
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?defina POSTGRES_USER no .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?defina POSTGRES_PASSWORD no .env}
      POSTGRES_DB: ${POSTGRES_DB:?defina POSTGRES_DB no .env}
    # O Postgres escuta na mesma porta dentro e fora do container (POSTGRES_PORT).
    command: ["postgres", "-p", "${POSTGRES_PORT:-5432}"]
    ports:
      # Só loopback, para o `pnpm dev` e o psql do host; nunca "5432:5432".
      - "127.0.0.1:${POSTGRES_PORT:-5432}:${POSTGRES_PORT:-5432}"
    volumes:
      # Postgres 18+: o dado fica em /var/lib/postgresql/<versão>; monte o diretório pai.
      - pgdata:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -p ${POSTGRES_PORT:-5432} -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 3s
      timeout: 3s
      retries: 20

  ollama:
    image: ollama/ollama:0.40.13
    environment:
      # Mantém o modelo na memória entre perguntas (recarregar custa caro, sobretudo na CPU).
      OLLAMA_KEEP_ALIVE: 30m
      OLLAMA_NUM_PARALLEL: "1"
      # Chat + embeddings.
      OLLAMA_MAX_LOADED_MODELS: "2"
    ports:
      # Só loopback, para o `pnpm dev` (que roda no host); nunca "11434:11434".
      - "127.0.0.1:11434:11434"
    volumes:
      - ollama:/root/.ollama
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 5s
      timeout: 5s
      retries: 20

  # Sankhya falso (scripts/fake-sankhya.mjs): só para verificação, sem credenciais nem dados reais. Cadastre um perfil
  # com baseUrl http://sankhya-falso:8000 para diferenciá-lo do Sankhya real.
  sankhya-falso:
    image: node:26-alpine
    working_dir: /app
    command: ["node", "fake-sankhya.mjs", "8000"]
    environment:
      HOST: 0.0.0.0
    volumes:
      - ./scripts/fake-sankhya.mjs:/app/fake-sankhya.mjs:ro
      - ./scripts/fake-sankhya-dictionary.json:/app/fake-sankhya-dictionary.json:ro
      - ./scripts/fake-sankhya-data.mjs:/app/fake-sankhya-data.mjs:ro
    ports:
      # Só loopback, para testar fora do compose; nunca "4010:8000".
      - "127.0.0.1:4010:8000"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "--post-data=", "http://127.0.0.1:8000/login"]
      interval: 3s
      timeout: 3s
      retries: 10

  # Os modelos não são baixados aqui: rode `pnpm ai:pull-chat` e `pnpm ai:pull-embed` (uma vez; ficam no volume `ollama`).
  erp-assistant:
    build:
      context: .
      target: runner
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      # Só loopback: nunca "3100:3100", que exporia a ferramenta (e a sessão no Sankhya) na rede.
      - "127.0.0.1:3100:3100"
    environment:
      # Histórico, consultas salvas e perfis (dados reais do ERP): só no volume `pgdata`, nunca no repositório.
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:${POSTGRES_PORT:-5432}/${POSTGRES_DB}
      # Chave que cifra os segredos dos perfis: vem do `.env`, separada do banco.
      ENCRYPTION_KEY: ${ENCRYPTION_KEY:?defina ENCRYPTION_KEY no .env}
      # Assistente de IA: o Ollama do compose e os ajustes do preset (vazio = padrão do preset).
      OLLAMA_BASE_URL: http://ollama:11434
      AI_PRESET: ${AI_PRESET:-gpu}
      AI_CHAT_MODEL: ${AI_CHAT_MODEL:-}
      GOOGLE_GENERATIVE_AI_API_KEY: ${GOOGLE_GENERATIVE_AI_API_KEY:-}
      AI_GOOGLE_CHAT_MODEL: ${AI_GOOGLE_CHAT_MODEL:-}
      AI_THINK: ${AI_THINK:-}
      AI_EMBED_MODEL: ${AI_EMBED_MODEL:-}
      AI_NUM_CTX: ${AI_NUM_CTX:-}
      AI_TOP_TABLES: ${AI_TOP_TABLES:-}
      AI_MAX_COLUMNS_PER_TABLE: ${AI_MAX_COLUMNS_PER_TABLE:-}
      AI_MAX_STEPS: ${AI_MAX_STEPS:-}
      AI_MAX_FIX_ATTEMPTS: ${AI_MAX_FIX_ATTEMPTS:-}
      AI_TIMEOUT_MS: ${AI_TIMEOUT_MS:-}

volumes:
  pgdata:
  ollama:
